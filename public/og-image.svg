<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- ================================================================ -->
  <!-- OG Image for AmbigramGen.com                                     -->
  <!-- Size: 1200x630px (Facebook/Twitter/LinkedIn标准)                  -->
  <!-- ================================================================ -->
  
  <!-- 背景渐变 - 品牌色 紫色→粉色 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    
    <!-- 副渐变 - 用于装饰元素 -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f0abfc;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#c084fc;stop-opacity:0.6" />
    </linearGradient>
    
    <!-- 文字渐变 -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fdf4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fae8ff;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow 效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 主背景 -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- 装饰性几何图形 - 左上角 -->
  <circle cx="100" cy="80" r="120" fill="url(#accentGradient)" opacity="0.15"/>
  <circle cx="150" cy="120" r="80" fill="url(#accentGradient)" opacity="0.1"/>
  
  <!-- 装饰性几何图形 - 右下角 -->
  <circle cx="1100" cy="550" r="150" fill="url(#accentGradient)" opacity="0.12"/>
  <circle cx="1050" cy="500" r="100" fill="url(#accentGradient)" opacity="0.08"/>
  
  <!-- Logo 图标 - 旋转对称符号 -->
  <g transform="translate(100, 80)">
    <!-- 外圆 -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="white" stroke-width="3" opacity="0.9"/>
    <!-- 内部旋转箭头 -->
    <path d="M 0,-25 L 8,-15 L -8,-15 Z" fill="white" opacity="0.9"/>
    <path d="M 0,25 L -8,15 L 8,15 Z" fill="white" opacity="0.9"/>
    <path d="M -20,0 L -10,8 L -10,-8 Z" fill="white" opacity="0.7"/>
    <path d="M 20,0 L 10,-8 L 10,8 Z" fill="white" opacity="0.7"/>
  </g>
  
  <!-- Logo 文字 -->
  <text x="160" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="white" opacity="0.95">
    AmbigramGen.com
  </text>
  
  <!-- 主标题 -->
  <text x="100" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="white" filter="url(#glow)">
    Free Ambigram
  </text>
  <text x="100" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="white" filter="url(#glow)">
    Generator
  </text>
  
  <!-- 副标题 -->
  <text x="100" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="500" fill="white" opacity="0.9">
    Create Stunning Ambigrams in Seconds
  </text>
  
  <!-- 特性标签 -->
  <g transform="translate(100, 480)">
    <!-- 标签1: Free -->
    <rect x="0" y="0" width="100" height="45" rx="8" fill="white" opacity="0.2"/>
    <text x="50" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="white" text-anchor="middle">
      FREE
    </text>
    
    <!-- 标签2: No Watermark -->
    <rect x="120" y="0" width="180" height="45" rx="8" fill="white" opacity="0.2"/>
    <text x="210" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="white" text-anchor="middle">
      No Watermark
    </text>
    
    <!-- 标签3: HD Export -->
    <rect x="320" y="0" width="150" height="45" rx="8" fill="white" opacity="0.2"/>
    <text x="395" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="white" text-anchor="middle">
      HD Export
    </text>
  </g>
  
  <!-- 右侧 Ambigram 示例 - LOVE ↔ LIFE 简化版 -->
  <g transform="translate(850, 315)">
    <!-- 示例文字框 -->
    <rect x="-150" y="-180" width="300" height="360" rx="16" fill="white" opacity="0.15" stroke="white" stroke-width="2" opacity="0.3"/>
    
    <!-- 示例标题 -->
    <text x="0" y="-130" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="white" text-anchor="middle" opacity="0.8">
      Example:
    </text>
    
    <!-- LOVE (正向) -->
    <text x="0" y="-40" font-family="Georgia, serif" font-size="64" font-weight="700" fill="white" text-anchor="middle" opacity="0.95">
      LOVE
    </text>
    
    <!-- 旋转箭头 -->
    <g transform="translate(0, 30)">
      <path d="M -30,0 L 30,0" stroke="white" stroke-width="2" opacity="0.6"/>
      <path d="M 20,-8 L 30,0 L 20,8" fill="white" opacity="0.6"/>
      <circle cx="0" cy="0" r="12" fill="none" stroke="white" stroke-width="2" opacity="0.5"/>
      <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">
        180°
      </text>
    </g>
    
    <!-- LIFE (倒转后，模拟 ambigram 效果) -->
    <g transform="translate(0, 160) rotate(180)">
      <text x="0" y="0" font-family="Georgia, serif" font-size="64" font-weight="700" fill="white" text-anchor="middle" opacity="0.95">
        LIFE
      </text>
    </g>
  </g>
  
  <!-- 底部装饰线 -->
  <line x1="100" y1="570" x2="500" y2="570" stroke="white" stroke-width="3" opacity="0.3" stroke-linecap="round"/>
</svg>

